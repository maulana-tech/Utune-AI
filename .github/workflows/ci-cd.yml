name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  ci:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=api --filter=workers --filter=@repo/db

  deploy:
    name: Deploy to VPS
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== Updating code ==="
            cd ~/app
            git pull

            echo "=== Installing deps ==="
            export PNPM_HOME=~/.local/share/pnpm
            export PATH=$PNPM_HOME:$PATH
            pnpm install --frozen-lockfile

            echo "=== Python deps (scraper venv) ==="
            [ -x apps/workers/.venv/bin/python ] || python3 -m venv apps/workers/.venv
            apps/workers/.venv/bin/pip install -q -r apps/workers/requirements.txt

            echo "=== Building ==="
            pnpm turbo build --filter=api --filter=workers

            echo "=== Database schema (drizzle push, additive changes only) ==="
            pnpm --filter @repo/db push
            pnpm --filter @repo/db rls

            echo "=== Restarting PM2 ==="
            pm2 startOrReload ecosystem.config.js --update-env

            echo "=== Done ==="
